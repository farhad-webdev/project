        --bg: #ffffff;
        --bg-2: #f4f4f4;
        --surface: #ffffff;
        --surface-2: #fafafa;
        --ink: #000000;
        --ink-2: #2b2b2b;
        --ink-3: #6b6b6b;
        --line: #e3e3e3;
        --brand: #000000;
        --brand-2: #000000;
        --brand-soft: #eeeeee;
        --gold: #000000;
        --gold-soft: #eeeeee;
        --red: #000000;
        --red-soft: #eeeeee;
        --blue: #000000;

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; background: #ffffff; color-scheme: light; }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #000000;

      h1, h2, h3, .lexend { font-family: "Lexend", "Inter", system-ui, sans-serif; }

      /* ---------- Hero ---------- */
      .hero {
        background: #ffffff;
        color: #000000;
        padding: 40px 0 34px;

      .hero-top { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; justify-content: space-between; }
      .hero h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.12; margin: 0 0 8px; font-weight: 800; letter-spacing: -.01em; }
      .hero p.lede { margin: 0; max-width: 620px; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
      .hero .sheet-link {
        display: inline-flex; align-items: center; gap: 8px;
        background: #ffffff; border: 1px solid #000000;
        color: #000000; text-decoration: none; font-size: 13px; font-weight: 600;
        padding: 9px 14px; border-radius: 999px; white-space: nowrap;
      }
      .hero .sheet-link:hover { background: #eeeeee; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 28px; }
      .stat {
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 14px 16px;
      }
      .stat b { display: block; font-family: "Lexend", sans-serif; font-size: 26px; font-weight: 700; line-height: 1; }
      .stat span { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
      @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }

      /* ---------- Controls ---------- */
      .controls {
        position: sticky; top: 0; z-index: 40;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        padding: 14px 0 12px;
      }
      .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .search-box { position: relative; flex: 1 1 260px; }
      .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--ink-3); pointer-events: none; }
      .search-box input {
        width: 100%; padding: 11px 38px 11px 38px;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--surface); color: var(--ink); font-size: 14.5px;
        outline: none;
      }
      .search-box input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--brand-soft); }
      .search-clear {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
        width: 28px; height: 28px; border-radius: 8px; font-size: 16px; line-height: 1; display: none;
      }
      .search-clear:hover { background: var(--surface-2); color: var(--ink); }
      .selects { display: flex; gap: 8px; flex-wrap: wrap; }
      .selects select {

        background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer;
        appearance: none;

        background-repeat: no-repeat; background-position: right 11px center;
      }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .chip {
        border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
        padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .chip .n { font-size: 11.5px; background: var(--bg-2); color: var(--ink-2); border-radius: 999px; padding: 1px 7px; font-weight: 700; }
      .chip:hover { border-color: var(--brand-2); color: var(--ink); }
      .chip.active { background: #000000; border-color: #000000; color: #ffffff; }
      .chip.active .n { background: rgba(255,255,255,.22); color: #ffffff; }
      .chip.muted { color: var(--ink-3); border-style: dashed; }
      .chip.muted .n { color: var(--ink-3); }
      .chip.muted:hover { color: var(--ink-2); border-color: var(--ink-3); }
      .chip.muted.active { background: #000000; border-color: #000000; border-style: solid; color: #ffffff; }
      .chip.muted.active .n { background: rgba(255,255,255,.22); color: #ffffff; }
      section.cat.dim .cat-head h2 { color: var(--ink-3); }
      .result-line { margin-top: 10px; font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .result-line button { border: 0; background: none; color: var(--brand-2); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0; display: none; }
      .result-line button:hover { text-decoration: underline; }

      /* ---------- Sections & cards ---------- */
      main { padding: 8px 0 30px; }
      section.cat { margin-top: 30px; }
      .cat-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
      .cat-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
      .cat-head .count { font-size: 12.5px; font-weight: 700; background: var(--brand-soft); color: var(--brand-2); padding: 3px 10px; border-radius: 999px; }
      .cat-head p { margin: 0; font-size: 13px; color: var(--ink-3); flex-basis: 100%; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      @media (max-width: 1020px) { .grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 16px 16px 14px; box-shadow: var(--shadow);
        display: flex; flex-direction: column; gap: 10px; min-width: 0;

      .pill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: .01em; border: 1px solid var(--line); }

      function matches(p) {
        if (state.cat !== "all" && p.p !== state.cat) return false;
        if (state.status !== "all" && p.s !== state.status) return false;
        if (state.year !== "all" && p.d.slice(0, 4) !== state.year) return false;
        if (state.q) {
          var h = haystack(p);
          var tokens = norm(state.q).split(/\s+/).filter(Boolean);
          for (var i = 0; i < tokens.length; i++) { if (!tokenMatches(tokens[i], h)) return false; }
        }
        return true;
      }
      function highlight(text, query) {
        var out = esc(text);
        if (!query) return out;
        var tokens = norm(query).split(/\s+/).filter(Boolean).sort(function (a, b) { return b.length - a.length; });
        tokens.forEach(function (tok) {
          if (tok.length < 2) return;
          var idx = out.toLowerCase().indexOf(tok.toLowerCase());
          if (idx !== -1) out = out.slice(0, idx) + "<mark>" + out.slice(idx, idx + tok.length) + "</mark>" + out.slice(idx + tok.length);
        });
        return out;
      }

      function sortList(list) {
        var arr = list.slice();
        if (state.q) {
          // Search thakle shobcheye valo mile jawa client age asbe
          arr.sort(function (a, b) {
            var d = scoreProject(b, state.q) - scoreProject(a, state.q);
            if (d !== 0) return d;
            return a.n.toLowerCase().localeCompare(b.n.toLowerCase());
          });
          return arr;
        }
        if (state.sort === "az") arr.sort(function (a, b) { return a.n.toLowerCase().localeCompare(b.n.toLowerCase()); });
        else if (state.sort === "oldest") arr.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
        else arr.sort(function (a, b) { return a.d > b.d ? -1 : a.d < b.d ? 1 : 0; });
        return arr;
      }

      function cardHTML(p) {
        var st = STATUS[p.s];
        var links = p.u.map(function (x) {
          return '<a class="site-link" href="' + esc(x[1]) + '" target="_blank" rel="noopener">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' +
            '<span>' + esc(x[0]) + '</span>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></a>';
        }).join("");
        var note = p.note ? '<div class="group-title">' + esc(p.note) + '</div>' : "";
        var qTokens = norm(state.q).split(/\s+/).filter(Boolean);
        var tagsHtml = '<div class="tags">' + getTags(p).map(function (tg) {
          var isMatch = qTokens.some(function (tok) { return tg.toLowerCase().indexOf(tok) !== -1 || tok.indexOf(tg.toLowerCase()) !== -1; });
          return '<span class="tag' + (isMatch ? " match" : "") + '">' + esc(tg) + '</span>';
        }).join("") + '</div>';
        return '<article class="card">' +
          '<div class="card-top"><div style="display:flex;gap:11px;min-width:0"><div class="avatar">' + esc(initials(p.n)) + '</div>' +
          '<div style="min-width:0"><h3>' + highlight(p.n, state.q) + '</h3><div class="group-title">' + esc(p.t) + '</div></div></div>' +
          '<span class="pill ' + st.cls + '">' + st.label + '</span></div>' +
          tagsHtml +
          note +
          '<div class="links">' + links + '</div>' +
          '<div class="meta"><span>Latest activity: <b>' + esc(p.a) + '</b></span><span>Verification: <b>Panel-checked</b></span></div>' +
          '</article>';
      }

      function render() {
        renderChips();
        var filtered = sortList(PROJECTS.filter(matches));
        var html = "";
        if (state.cat === "all") {
          CATS.slice(1).forEach(function (c) {
            var items = filtered.filter(function (p) { return p.p === c.id; });
            if (!items.length) return;
            html += '<section class="cat' + (c.id === "unverified" ? " dim" : "") + '"><div class="cat-head"><h2>' + esc(c.label) + '</h2><span class="count">' + items.length + ' ta group</span>' + (c.desc ? '<p>' + esc(c.desc) + '</p>' : '') + '</div>' +
              '<div class="grid">' + items.map(cardHTML).join("") + '</div></section>';
          });
        } else {
          var c = CATS.filter(function (x) { return x.id === state.cat; })[0];
          if (filtered.length) {
            html = '<section class="cat' + (c.id === "unverified" ? " dim" : "") + '"><div class="cat-head"><h2>' + esc(c.label) + '</h2><span class="count">' + filtered.length + ' ta group</span>' + (c.desc ? '<p>' + esc(c.desc) + '</p>' : '') + '</div>' +
              '<div class="grid">' + filtered.map(cardHTML).join("") + '</div></section>';
          }
        }
        $("main").innerHTML = html;
        $("empty").style.display = filtered.length ? "none" : "block";
        if (!filtered.length && state.q) {
          $("empty").querySelector("h3").textContent = '"' + state.q + '" diye kono client mile ni';
          $("empty").querySelector("p").textContent = "Namer aro chhoto ongsho likhe try koro — jemon prothom 3-4 okkhor, ba niche / domain er ekta word. Athoba Reset diye shob group dekhao.";
        } else if (!filtered.length) {
          $("empty").querySelector("h3").textContent = "Kono project mile ni";
          $("empty").querySelector("p").textContent = "Search ba filter change kore abar try koro — athoba Reset diye shob group abar dekhao.";
        }
        $("resultCount").textContent = state.q
          ? '"' + state.q + '" diye mile jawa ' + filtered.length + " ta project dekhachhe — shobcheye valo match age"
          : filtered.length + " ta project dekhachhe — total " + PROJECTS.length + " ta group er moddhe";
        var dirty = state.q || state.cat !== "all" || state.status !== "all" || state.year !== "all";
        $("resetBtn").style.display = dirty ? "inline" : "none";
        $("qClear").style.display = state.q ? "block" : "none";
      }

      function resetAll() {
        state = { q: "", cat: "all", status: "all", year: "all", sort: state.sort };
        $("q").value = ""; $("fStatus").value = "all"; $("fYear").value = "all";
        if (typeof closeSuggest === "function") closeSuggest();
        render();
      }

      /* ---------- Live suggestions: likhte likhte mile jawa client ---------- */
      var suggestIndex = -1;
      function closeSuggest() {
        $("suggestBox").classList.remove("open");
        $("suggestBox").innerHTML = "";
        $("q").setAttribute("aria-expanded", "false");
        suggestIndex = -1;
      }
      function renderSuggest() {
        var q = norm(state.q);
        if (!q) { closeSuggest(); return; }
        // Status / year / category filter bad diye shudhu search diye match khoja hoy, jate suggestion miss na hoy
        var saved = { cat: state.cat, status: state.status, year: state.year };
        state.cat = "all"; state.status = "all"; state.year = "all";
        var found = PROJECTS.filter(matches);
        state.cat = saved.cat; state.status = saved.status; state.year = saved.year;
        found = found.map(function (p) { return { p: p, s: scoreProject(p, state.q) }; })
          .sort(function (a, b) { return b.s - a.s || a.p.n.toLowerCase().localeCompare(b.p.n.toLowerCase()); })
          .slice(0, 8);
        if (!found.length) { closeSuggest(); return; }
        suggestIndex = -1;
        $("suggestBox").innerHTML = '<div class="suggest-head">' + found.length + ' ta matching client — click korlei show korbe</div>' + found.map(function (f, i) {
          var tags = getTags(f.p);
          return '<button type="button" class="suggest-item" role="option" data-name="' + esc(f.p.n) + '" data-idx="' + i + '">' +
            '<span><span class="s-name">' + highlight(f.p.n, state.q) + '</span><br><span class="s-domain">' + esc(f.p.u.map(function (x) { return x[0]; }).join(" · ")) + '</span></span>' +
            (tags.length ? '<span class="s-tag">' + esc(tags[0]) + '</span>' : '') + '</button>';
        }).join("");
        $("suggestBox").classList.add("open");
        $("q").setAttribute("aria-expanded", "true");
        var items = $("suggestBox").querySelectorAll(".suggest-item");
        for (var i = 0; i < items.length; i++) {
          items[i].addEventListener("mousedown", function (e) {
            e.preventDefault();
            pickSuggest(this.getAttribute("data-name"));
          });
        }
      }
      function pickSuggest(name) {
        state.q = name; $("q").value = name;
        closeSuggest(); render(); $("q").focus();
      }
      function moveSuggest(dir) {
        var items = $("suggestBox").querySelectorAll(".suggest-item");
        if (!items.length) return;
        suggestIndex = Math.max(-1, Math.min(items.length - 1, suggestIndex + dir));
        for (var i = 0; i < items.length; i++) items[i].classList.toggle("active", i === suggestIndex);
        if (suggestIndex >= 0) items[suggestIndex].scrollIntoView({ block: "nearest" });
      }

      $("q").addEventListener("input", function () { state.q = this.value.trim(); render(); renderSuggest(); });
      $("q").addEventListener("focus", function () { if (state.q) renderSuggest(); });
      $("q").addEventListener("blur", function () { setTimeout(closeSuggest, 150); });
      $("q").addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") { e.preventDefault(); moveSuggest(1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); moveSuggest(-1); }
        else if (e.key === "Enter") {
          var items = $("suggestBox").querySelectorAll(".suggest-item");
          if (suggestIndex >= 0 && items[suggestIndex]) { e.preventDefault(); pickSuggest(items[suggestIndex].getAttribute("data-name")); }
          else closeSuggest();
        } else if (e.key === "Escape") { closeSuggest(); }
      });
      document.addEventListener("click", function (e) {
        if (!$("suggestBox").contains(e.target) && e.target !== $("q")) closeSuggest();
      });
      $("qClear").addEventListener("click", function () { state.q = ""; $("q").value = ""; closeSuggest(); render(); $("q").focus(); });
      $("fStatus").addEventListener("change", function () { state.status = this.value; render(); });
      $("fYear").addEventListener("change", function () { state.year = this.value; render(); });
      $("fSort").addEventListener("change", function () { state.sort = this.value; render(); });
      $("resetBtn").addEventListener("click", resetAll);
      document.addEventListener("keydown", function (e) {
        if (e.key === "/" && document.activeElement !== $("q") && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
          e.preventDefault(); $("q").focus();
        }
      });

      renderStats();
      render();
    </script>
  </body>
</html>
